services:
  rivestream-stremio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivestream-stremio
    restart: unless-stopped
    ports:
      - "7033:7033"
    environment:
      - PORT=7033
      - NODE_ENV=production
    volumes:
      # Persistenza della cache canali
      - rivestream-cache:/app/cache/channels
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7033/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rivestream-cache:
    name: rivestream-stremio-cache
